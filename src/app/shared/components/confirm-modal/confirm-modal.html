@if (visible) {
<div class="modal-backdrop" (click)="onCancel()">
    <div class="confirm-modal" role="dialog" aria-modal="true" [attr.aria-labelledby]="'confirm-modal-title'"
        (click)="$event.stopPropagation()">
        <!-- Header -->
        <div class="modal-header">
            <h3 id="confirm-modal-title">
                {{ title }}
            </h3>
            <button type="button" class="close-button" aria-label="Close" (click)="onCancel()">
                ×
            </button>
        </div>

        <!-- Body -->
        <div class="modal-body">
            <p>{{ message }}</p>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
            <button type="button" class="secondary" (click)="onCancel()">
                {{ cancelText }}
            </button>
            <button type="button" class="primary" (click)="onConfirm()">
                {{ confirmText }}
            </button>
        </div>
    </div>
</div>
}
